name: Build from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL file ZIP (source code)'
        required: true
        type: string
      tag:
        description: 'Tag untuk release (misal v1.0.0)'
        required: true
        type: string
      build_type:
        description: 'Jenis build (debug/release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write   # izin untuk membuat release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download source code ZIP
        run: |
          curl -L -o source.zip "${{ github.event.inputs.zip_url }}"
          unzip source.zip -d source
          # Asumsikan ZIP berisi satu folder, pindahkan isinya ke root
          cd source && mv * ../ && cd ..
          rm -rf source source.zip

      - name: Set up JDK 17 (untuk Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assemble${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}

      - name: Upload APK ke Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/*/*.apk
          tag_name: ${{ github.event.inputs.tag }}
          name: "Build ${{ github.event.inputs.tag }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
