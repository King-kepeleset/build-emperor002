name: Build APK from Source

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      branch:
        description: 'Branch yang akan di-build'
        required: true
        default: 'main'
        type: string

# IZIN RELEASE – TAMBAHKAN INI!
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # === Untuk Android Native (Gradle) ===
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assemble${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}

      # === UPLOAD ARTIFACT SEMENTARA ===
      - name: Upload APK sebagai artifact (sementara)
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type }}
          path: app/build/outputs/apk/*/*.apk

      # === BUAT RELEASE DAN UPLOAD APK ===
      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/*/*.apk
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} (${{ github.event.inputs.build_type }})"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}   # <-- Ganti sesuai nama secret token kamu
