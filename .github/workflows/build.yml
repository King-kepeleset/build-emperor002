name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Jenis build (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      branch:
        description: 'Branch yang akan di-build'
        required: true
        default: 'main'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # === Untuk Android Native (Gradle) ===
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assemble${{ github.event.inputs.build_type == 'debug' && 'Debug' || 'Release' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type }}
          path: app/build/outputs/apk/*/*.apk

      # === Atau jika pakai Flutter, ganti step di atas dengan ini: ===
