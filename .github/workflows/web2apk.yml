name: Web to APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL website yang akan diubah menjadi APK'
        required: true
        type: string
        default: 'https://example.com'
      app_name:
        description: 'Nama aplikasi'
        required: true
        type: string
        default: 'MyApp'
      app_id:
        description: 'Package ID (contoh: com.example.app)'
        required: true
        type: string
        default: 'com.example.app'
      icon_url:
        description: 'URL icon (opsional)'
        required: false
        type: string
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install web2apk
        run: npm install -g web2apk

      - name: Generate APK
        run: |
          web2apk generate \
            --url "${{ github.event.inputs.url }}" \
            --name "${{ github.event.inputs.app_name }}" \
            --id "${{ github.event.inputs.app_id }}" \
            ${{ github.event.inputs.icon_url && format('--icon {0}', github.event.inputs.icon_url) || '' }} \
            --output ./app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-${{ github.event.inputs.app_name }}
          path: ./app.apk
