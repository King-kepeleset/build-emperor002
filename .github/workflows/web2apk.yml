name: Web to APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: true
        type: string
      icon_url:
        description: 'URL icon (opsional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web2apk
        run: npm install -g web2apk

      - name: Generate APK
        run: |
          web2apk generate \
            --url "${{ github.event.inputs.web_url }}" \
            --name "${{ github.event.inputs.app_name }}" \
            ${{ github.event.inputs.icon_url && format('--icon {0}', github.event.inputs.icon_url) || '' }} \
            --output ./app.apk

      - name: Upload APK ke Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./app.apk
          tag_name: web-${{ github.run_number }}
          name: "Web2APK ${{ github.event.inputs.app_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
